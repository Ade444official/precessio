function angles(T){const T2pi=T*2*Math.PI;let psi=0,ome=0,chi=0,eps=0;
 for(const r of precVals){const p=T2pi*r[0],c=Math.cos(p),s=Math.sin(p);

 for(let i=0;i<3;i++)for(let j=0;j<3;j++)for(let k=0;k<3;k++)M[i][j]+=A[i][k]*B[k][j];return M;}
function mv(A,v){return [A[0][0]*v[0]+A[0][1]*v[1]+A[0][2]*v[2],
 A[1][0]*v[0]+A[1][1]*v[1]+A[1][2]*v[2],A[2][0]*v[0]+A[2][1]*v[1]+A[2][2]*v[2]];}
function precMatrix(T){const [psi,ome,chi]=angles(T);
 return mm(R3(chi),mm(R1(-ome),mm(R3(-psi),R1(EPS0))));}

function starOfDate(s,year){
 const ra=s[1],dec=s[2],pmra=s[3],pmdec=s[4],plx=s[6],rv=s[7];let raE,decE;
 if(plx>0){const d=1000/plx,rr=vec(ra,dec),rar=ra*D2R,der=dec*D2R;
  const p=[-Math.sin(rar),Math.cos(rar),0];
  const q=[-Math.sin(der)*Math.cos(rar),-Math.sin(der)*Math.sin(rar),Math.cos(der)];
  const k=AS2R/1000,dt=year-2000;
  const vt=[(pmra*k*p[0]+pmdec*k*q[0])*d,(pmra*k*p[1]+pmdec*k*q[1])*d,(pmra*k*p[2]+pmdec*k*q[2])*d];
  const vr=rv*1.0227e-6;
  const pos=[rr[0]*d+(vt[0]+vr*rr[0])*dt,rr[1]*d+(vt[1]+vr*rr[1])*dt,rr[2]*d+(vt[2]+vr*rr[2])*dt];
  [raE,decE]=radec(pos);
 } else {const dt=year-2000;decE=dec+pmdec*dt/3.6e6;raE=ra+(pmra/Math.cos(dec*D2R))*dt/3.6e6;}
 const T=(year-2000)/100;return radec(mv(precMatrix(T),vec(raE,decE)));}
function altaz(ra,dec,lst,lat){
 const H=(lst-ra)*D2R,d=dec*D2R,p=lat*D2R;
 const alt=Math.asin(Math.sin(p)*Math.sin(d)+Math.cos(p)*Math.cos(d)*Math.cos(H));
 const A=Math.atan2(-Math.cos(d)*Math.sin(H),Math.sin(d)*Math.cos(p)-Math.cos(d)*Math.sin(p)*Math.cos(H));
 return [alt*R2D,((A*R2D)+360)%360];}

// ============ TERRENO REALE — DEM SRTM + foto aerea ============
function ll2tile(lat,lon,z){const n=Math.pow(2,z);
 const x=(lon+180)/360*n;
 const la=lat*D2R;
 const y=(1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n;
 return [x,y];}
function loadTile(url,raw){
 if(raw&&self.createImageBitmap){ // DEM: niente gestione colore, i byte devono restare intatti
  return fetch(url,{mode:'cors'}).then(r=>r.blob())
   .then(b=>createImageBitmap(b,{colorSpaceConversion:'none',premultiplyAlpha:'none'}));}
 return new Promise((res,rej)=>{
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>res(im);im.onerror=rej;im.src=url;});}
async function fetchGrid(z,cnt,urlFn,lat,lon,raw){
 const [tx,ty]=ll2tile(lat,lon,z);
 const cx=Math.floor(tx),cy=Math.floor(ty),h=(cnt-1)/2;
 const cv=document.createElement('canvas');cv.width=cv.height=cnt*256;
 const g=cv.getContext('2d',raw?{colorSpace:'srgb',willReadFrequently:true}:undefined);
 if(raw)g.imageSmoothingEnabled=false;
 const jobs=[];
 for(let dx=-h;dx<=h;dx++)for(let dy=-h;dy<=h;dy++)
  jobs.push(loadTile(urlFn(z,cx+dx,cy+dy),raw).then(im=>g.drawImage(im,(dx+h)*256,(dy+h)*256)));
 await Promise.all(jobs);
 return {cv,g,px0:(cx-h)*256,py0:(cy-h)*256,size:cnt*256};}
const USA_DEM=new URLSearchParams(location.search).get('dem')==='1';
async function buildTerrain(lat,lon,my,mlat,mlon){
 try{
  if(!USA_DEM){ // piana in piano: solo foto aerea drappeggiata (rilievo disattivato)
   terrainSampler=()=>0;
   await buildDrape(lat,lon,my,mlat,mlon,'terreno: piano (rilievo disattivato \u2014 aggiungi ?dem=1 per provarlo)');
   return;}
  const Zt=14;
  const elev=await fetchGrid(Zt,3,(z,x,y)=>
   'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/'+z+'/'+x+'/'+y+'.png',lat,lon,true);
  if(my!==groundId)return;
  const data=elev.g.getImageData(0,0,elev.size,elev.size,{colorSpace:'srgb'}).data,ES=elev.size;
  const hRaw=(la,lo)=>{const t=ll2tile(la,lo,Zt);
   let px=Math.round(t[0]*256-elev.px0),py=Math.round(t[1]*256-elev.py0);
   px=Math.max(0,Math.min(ES-1,px));py=Math.max(0,Math.min(ES-1,py));
   const i=(py*ES+px)*4;
   if(data[i+3]===0)return null;               // pixel trasparente = dato mancante
   const v=data[i]*256+data[i+1]+data[i+2]/256-32768;
   return (isFinite(v)&&v>-500&&v<9000)?v:null;}; // fuori range = dato non valido
  const h0=hRaw(lat,lon);
  console.info('[DEM] sito',lat.toFixed(5),lon.toFixed(5),'-> tile z14',
   Math.floor(ll2tile(lat,lon,Zt)[0]),Math.floor(ll2tile(lat,lon,Zt)[1]),
   '| h0 =',h0,'m');
  if(h0===null){console.warn('[DEM] h0 nullo: pixel trasparente o fuori range al sito stesso.');return;}
  // controllo di plausibilita': dislivello su 2 km entro limiti ragionevoli
  let mn=1e9,mx=-1e9,bad=0,tot=0,mnAt=null,mxAt=null;

   if(v>mx){mx=v;mxAt=[a,b];}}

  console.info('[DEM] dislivello su 2km:',Math.round(dislivello),'m  (min',Math.round(mn),'m a E/N',mnAt,
   ' | max',Math.round(mx),'m a E/N',mxAt,') letture nulle:',bad+'/'+tot);

   terrainSampler=(e,n)=>{const v=hRaw(lat+n/mlat,lon+e/mlon);

   if(my!==groundId)return;

     'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+z+'/'+y+'/'+x+'.png',lat,lon);

function obliquita(year){
 // Laskar 1986: valido entro +/-10.000 anni da J2000, precisione ottima nel raggio archeologico
 const t=(year-2000)/10000;
 if(Math.abs(t)<=1){
  return 23.439291111
   -1.300258333*t -0.000430556*Math.pow(t,2) +0.555347222*Math.pow(t,3)
   -0.014272222*Math.pow(t,4) -0.069352778*Math.pow(t,5) -0.010847222*Math.pow(t,6)
   +0.001977778*Math.pow(t,7) +0.007741667*Math.pow(t,8) +0.001608333*Math.pow(t,9)
   +0.000680556*Math.pow(t,10);}
 // oltre i 10.000 anni il polinomio diverge: si usa l'oscillazione reale (~41.000 anni),
 // ancorata al massimo di ~8700 a.C. — APPROSSIMATA, dichiararlo se usata nel libro
 return 23.415+0.815*Math.cos(2*Math.PI*(year+8700)/41000);
}
function soleRaDec(lambda,year){
 // dalla longitudine eclittica (0 equinozio di primavera, 90 solstizio d'estate...)
 const e=obliquita(year)*D2R, l=lambda*D2R;
 const dec=Math.asin(Math.sin(e)*Math.sin(l))*R2D;
 const ra=((Math.atan2(Math.cos(e)*Math.sin(l),Math.cos(l))*R2D)+360)%360;
 return [ra,dec];
}
function angoloOrarioAlba(dec,lat){
 // angolo orario del sorgere (negativo). null se il Sole non sorge/tramonta mai
 const c=-Math.tan(lat*D2R)*Math.tan(dec*D2R);
 if(c<-1||c>1)return null;
 return -Math.acos(c)*R2D;
}

 // foschia atmosferica: e' il segnale che il cervello usa per giudicare la distanza

// il cielo prende colore dalla posizione reale del Sole
function aggiornaCielo(sunAlt,sunAz){
 if(!skyGeo)return;
 const pos=skyGeo.attributes.position,col=skyGeo.attributes.color,Rs=R+60;
 const giorno=Math.max(0,Math.min(1,(sunAlt+12)/15));       // 0 notte piena, 1 pieno giorno
 const crepuscolo=Math.max(0,1-Math.abs(sunAlt)/14);        // massimo col Sole sull'orizzonte
 const sa=sunAz*D2R;
 for(let i=0;i<pos.count;i++){
  const x=pos.getX(i),y=pos.getY(i),z=pos.getZ(i);
  const t=Math.pow(Math.max(0,Math.min(1,(y/Rs+0.06)/1.06)),0.55);  // 0 orizzonte, 1 zenit
  let r=(0.115*(1-t)+0.010*t)*(1-giorno)+(0.60*(1-t)+0.13*t)*giorno;
  let g=(0.070*(1-t)+0.007*t)*(1-giorno)+(0.72*(1-t)+0.30*t)*giorno;
  let b=(0.135*(1-t)+0.020*t)*(1-giorno)+(0.88*(1-t)+0.62*t)*giorno;
  if(crepuscolo>0.01){   // il fuoco dell'alba e del tramonto, dalla parte giusta del cielo
   let d=Math.abs(Math.atan2(x,-z)-sa);if(d>Math.PI)d=2*Math.PI-d;
   const f=crepuscolo*Math.max(0,1-d/(Math.PI*0.75))*Math.pow(Math.max(0,1-t),2.2);
   r+=f*0.85;g+=f*0.36;b+=f*0.10;}
  col.setXYZ(i,Math.min(1,r),Math.min(1,g),Math.min(1,b));}
 col.needsUpdate=true;
 // la foschia prende il colore dell'orizzonte: la lontananza sfuma nel cielo, non nel nero
 if(scene.fog)scene.fog.color.setRGB(
  0.115*(1-giorno)+0.60*giorno, 0.070*(1-giorno)+0.72*giorno, 0.135*(1-giorno)+0.88*giorno);
}

function pollVR(dt){
 vrHud.sp.visible=true;
 let mosso=false;
 for(const c of controllers){
  const gp=c.userData.gp,P=c.userData.prev;if(!gp)continue;
  const ax=gp.axes;
  const sx=(ax.length>=4?ax[2]:(ax[0]||0));
  const sy=(ax.length>=4?ax[3]:(ax[1]||0));
  if(c.userData.hand==='left'){
   if(dt&&Math.hypot(sx,sy)>0.15){moveRig(dt,sx,-sy);mosso=true;}   // cammina/vola in orizzontale
  }else{
   if(dt&&Math.abs(sy)>0.2){changeAltitude(dt,-sy);mosso=true;}      // sali e scendi
   if(sx>0.6&&P.snap!==1){rig.rotation.y-=Math.PI/6;P.snap=1;}
   else if(sx<-0.6&&P.snap!==-1){rig.rotation.y+=Math.PI/6;P.snap=-1;}
   else if(Math.abs(sx)<0.3)P.snap=0;}
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
  // grilletto = marcia lenta, presa laterale = marcia veloce (nel visore serve delicatezza)
  if(b(0)&&!P.t){playDir=(playDir!==0)?0:(c.userData.hand==='left'?-0.12:0.12);}P.t=b(0);
  if(b(1)&&!P.g){playDir=(playDir!==0)?0:(c.userData.hand==='left'?-1:1);}P.g=b(1);
  if(b(4)&&!P.a){cycleSelect('scene');}P.a=b(4);
  if(b(5)&&!P.b){cycleSelect('site');}P.b=b(5);
 }
 if(mosso)aggiornaQuota();
}

// Piramide a gradoni: i corsi di muratura, non un cono liscio.
// Un'unica geometria con N scalini: alzata verticale + pedata orizzontale per corso.
function piramideGradoni(semiBase,altezza,corsi){
 const v=[],idx=[];
 const quad=(a,b,c,d)=>{const i=v.length/3;v.push(...a,...b,...c,...d);
  idx.push(i,i+1,i+2, i,i+2,i+3);};
 for(let k=0;k<corsi;k++){
  const y0=altezza*k/corsi, y1=altezza*(k+1)/corsi;
  const w0=semiBase*(1-k/corsi), w1=semiBase*(1-(k+1)/corsi);
  // alzata: le quattro facce verticali del corso
  quad([-w0,y0,-w0],[ w0,y0,-w0],[ w0,y1,-w0],[-w0,y1,-w0]);
  quad([ w0,y0, w0],[-w0,y0, w0],[-w0,y1, w0],[ w0,y1, w0]);
  quad([ w0,y0,-w0],[ w0,y0, w0],[ w0,y1, w0],[ w0,y1,-w0]);
  quad([-w0,y0, w0],[-w0,y0,-w0],[-w0,y1,-w0],[-w0,y1, w0]);
  // pedata: il gradino orizzontale che rientra verso il corso successivo
  quad([-w0,y1,-w0],[ w0,y1,-w0],[ w1,y1,-w1],[-w1,y1,-w1]);
  quad([ w0,y1, w0],[-w0,y1, w0],[-w1,y1, w1],[ w1,y1, w1]);
  quad([ w0,y1,-w0],[ w0,y1, w0],[ w1,y1, w1],[ w1,y1,-w1]);
  quad([-w0,y1, w0],[-w0,y1,-w0],[-w1,y1,-w1],[-w1,y1, w1]);
 }
 const g=new THREE.BufferGeometry();
 g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));
 g.setIndex(idx);g.computeVertexNormals();
 return g;
}
// tinte: i monumenti sono scuri di notte e calcarei in pieno sole
const TINTE={
 pietra:  {notte:0x1d0d10, giorno:0xB6A085},   // calcare del nucleo, eroso
 calcare: {notte:0x6d5b46, giorno:0xDCCEB4},   // Tura, il rivestimento fine
 granito: {notte:0x3d1a18, giorno:0x8E6A5C},   // Assuan, i corsi bassi di Micerino
 sfinge:  {notte:0x241014, giorno:0xC0A98B}
};
function materialePietra(tipo,dentro){
 const t=TINTE[tipo]||TINTE.pietra;
 const m=dentro
  ?new THREE.MeshBasicMaterial({color:t.notte,transparent:true,opacity:0.12,depthWrite:false})
  :new THREE.MeshBasicMaterial({color:t.notte});
 m.userData.cNotte=new THREE.Color(t.notte);
 m.userData.cGiorno=new THREE.Color(t.giorno);
 return m;
}
// la pietra si accende col Sole e torna scura di notte
function tintaMonumenti(giorno){
 for(const m of monuments){
  const mat=m.obj&&m.obj.material;
  if(!mat||!mat.userData.cNotte)continue;
  mat.color.copy(mat.userData.cNotte).lerp(mat.userData.cGiorno,giorno);}
 const c=0.28+0.72*giorno;   // la foto aerea e' diurna: la si spegne di notte
 for(const t of terreni)if(t.material)t.material.color.setRGB(c,c,c);
}
function trovaSito(lat,lon){
 if(!window.CATALOGO)return null;
 for(const k in CATALOGO){const s=CATALOGO[k];
  if(Math.abs(lat-s.centro.lat)<(s.raggio||0.05)&&Math.abs(lon-s.centro.lon)<(s.raggio||0.05))return s;}
 return null;}
function buildGround(){
 const my=++groundId;
 if(groundGroup)scene.remove(groundGroup);
 groundGroup=new THREE.Group();monuments=[];terreni=[];terrainSampler=null;
 const parts=document.getElementById('site').value.split(',');
 const lat=parseFloat(parts[0]),lon=parseFloat(parts[1]);
 const ground=new THREE.Mesh(new THREE.CircleGeometry(R+50,64),
  new THREE.MeshBasicMaterial({map:makeGroundTex()}));
 ground.rotation.x=-Math.PI/2;ground.position.y=-0.6;
 groundGroup.add(ground);terreni.push(ground);discoBase=ground;   // segue la luce del giorno
 const ring=new THREE.Mesh(new THREE.TorusGeometry(R-5,2.2,8,128),
  new THREE.MeshBasicMaterial({color:0xD4A94A}));
 ring.rotation.x=Math.PI/2;ring.position.y=0.5;groundGroup.add(ring);
 for(const [az,txt] of [[0,'NORD'],[90,'EST'],[180,'SUD'],[270,'OVEST']]){
  const l=makeLabel(txt,220);const [x,y,z]=azalt2xyz(az,1.5,R-40);
  l.position.set(x,y+30,z);groundGroup.add(l);}
 const mlat=110861,mlon=111320*Math.cos(lat*D2R);
 const EN=(plat,plon)=>[(plon-lon)*mlon,(plat-lat)*mlat];
 // ---- costruzione dal CATALOGO (catalogo.js) ----
 const sito=trovaSito(lat,lon);
 const etichette=[];   // per districare quelle che si accavallano
 if(sito){
  const forza=new URLSearchParams(location.search).get('tutto')==='1';
  const trovato={};
  for(const el of sito.elementi){
   if(!el.attivo&&!forza)continue;
   if(el.tipo==='nastro')continue;              // i nastri si tracciano dopo
   const [e0,n0]=EN(el.lat,el.lon);
   const e=e0+(el.offsetEst||0),n=n0+(el.offsetNord||0);
   trovato[el.id]={e,n};
   const dist=Math.hypot(e,n);
   if(dist>R-100)continue;
   const incerto=(el.fonte==='approssimato');
   const oro=incerto?0x8a6f3a:0xD4A94A;
   // ingombro dell'elemento: se l'osservatore ci sta dentro, lo si rende trasparente
   const raggio=el.tipo==='piramide'?el.base/2
              :(el.tipo==='marker'?el.raggio
              :Math.max(el.lunghezza||0,el.larghezza||0)/2);
   const dentro=dist<raggio*1.15;
   if(el.tipo==='piramide'){
    // un corso ogni ~2,5 m di altezza: la muratura si legge senza appesantire il visore
    const corsi=Math.max(8,Math.min(72,Math.round(el.altezza/2.5)));
    const py=new THREE.Mesh(piramideGradoni(el.base/2,el.altezza,corsi),
                            materialePietra('pietra',dentro));
    py.position.set(e,0,-n);
    const ed=new THREE.LineSegments(
     new THREE.EdgesGeometry(new THREE.ConeGeometry(el.base/Math.SQRT2,el.altezza,4)),
     new THREE.LineBasicMaterial({color:oro,transparent:true,opacity:incerto?0.35:0.6}));
    ed.position.set(e,el.altezza/2,-n);ed.rotation.y=Math.PI/4;
    const lb=makeLabel(el.nome,180);lb.position.set(e,el.altezza+40,-n);
    groundGroup.add(py);groundGroup.add(ed);groundGroup.add(lb);
    const mo={obj:py,edges:ed,label:lb,e,n,lift:0,labelLift:el.altezza+40,spigoliLift:el.altezza/2};
    monuments.push(mo);etichette.push({mo,lb,e,n,dist});
    if(el.rivestimento){ // calotta di calcare di Tura ancora in posto: liscia, non a gradoni
     const CH=el.rivestimento,rb=(el.base/Math.SQRT2)*(CH/el.altezza);
     const cap=new THREE.Mesh(new THREE.ConeGeometry(rb,CH,4),materialePietra('calcare'));
     cap.position.set(e,el.altezza-CH/2,-n);cap.rotation.y=Math.PI/4;
     groundGroup.add(cap);
     monuments.push({obj:cap,e,n,lift:el.altezza-CH/2,labelLift:0});}
    if(el.zoccolo){ // corsi inferiori in granito di Assuan
     const GH=el.zoccolo,rb=el.base/Math.SQRT2,rt=rb*(1-GH/el.altezza);
     const gr=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,GH,4),materialePietra('granito'));
     gr.position.set(e,GH/2,-n);gr.rotation.y=Math.PI/4;
     groundGroup.add(gr);
     monuments.push({obj:gr,e,n,lift:GH/2,labelLift:0});}
   }else if(el.tipo==='blocco'||el.tipo==='recinto'){
    const pieno=(el.tipo==='blocco');
    const bx=new THREE.Mesh(new THREE.BoxGeometry(el.lunghezza,el.altezza,el.larghezza),
     (pieno&&!dentro)?materialePietra('sfinge',false)
     :new THREE.MeshBasicMaterial({color:oro,wireframe:true,transparent:true,opacity:dentro?0.25:0.4}));
    bx.position.set(e,el.altezza/2,-n);
    bx.rotation.y=-((el.azimut||90)-90)*D2R;
    let ed=null;
    if(pieno){ed=new THREE.LineSegments(new THREE.EdgesGeometry(bx.geometry),
      new THREE.LineBasicMaterial({color:oro}));
     ed.position.copy(bx.position);ed.rotation.copy(bx.rotation);groundGroup.add(ed);}
    const lb=makeLabel(el.nome,pieno?150:170);
    lb.position.set(e,el.altezza+(dentro?90:35),-n);
    groundGroup.add(bx);groundGroup.add(lb);
    const mo={obj:bx,edges:ed,label:lb,e,n,lift:el.altezza/2,labelLift:el.altezza+(dentro?90:35)};
    monuments.push(mo);etichette.push({mo,lb,e,n,dist});
   }else if(el.tipo==='marker'){
    const co=new THREE.Mesh(new THREE.ConeGeometry(el.raggio,el.altezza,24),
     new THREE.MeshBasicMaterial({color:oro,wireframe:true,transparent:true,opacity:0.45}));
    co.position.set(e,el.altezza/2,-n);
    const lb=makeLabel(el.nome,150);lb.position.set(e,el.altezza+32,-n);
    groundGroup.add(co);groundGroup.add(lb);
    const mo={obj:co,label:lb,e,n,lift:el.altezza/2,labelLift:el.altezza+32};
    monuments.push(mo);etichette.push({mo,lb,e,n,dist});}}
  // nastri (rampe, allineamenti) fra elementi gia' posizionati
  for(const el of sito.elementi){
   if(el.tipo!=='nastro'||(!el.attivo&&!forza))continue;
   const A=trovato[el.da],B=trovato[el.a];if(!A||!B)continue;
   const dx=B.e-A.e,dz=(-B.n)-(-A.n),L=Math.hypot(dx,dz);
   if(L<10)continue;
   const nastro=new THREE.Mesh(new THREE.BoxGeometry(L*0.85,el.altezza||1,el.larghezza||5),
    new THREE.MeshBasicMaterial({color:0xD4A94A,transparent:true,opacity:0.35}));
   nastro.position.set((A.e+B.e)/2,(el.altezza||1)/2,(-A.n+-B.n)/2);
   nastro.rotation.y=Math.atan2(-dz,dx);
   groundGroup.add(nastro);
   monuments.push({obj:nastro,e:(A.e+B.e)/2,n:(A.n+B.n)/2,lift:(el.altezza||1)/2,labelLift:0});}}
 // districa le etichette vicine in direzione: la piu' lontana sale di un gradino
 etichette.sort((a,b)=>a.dist-b.dist);
 const messe=[];
 for(const t of etichette){
  const az=(Math.atan2(t.e,t.n)*R2D+360)%360;
  let salto=0;
  for(const m of messe){
   let d=Math.abs(az-m.az);if(d>180)d=360-d;
   if(d<6)salto=Math.max(salto,m.salto+1);}
  messe.push({az,salto});
  if(salto>0){
   const su=salto*55;
   t.lb.position.y+=su;
   t.mo.labelLift+=su;}}
 scene.add(groundGroup);
 buildTerrain(lat,lon,my,mlat,mlon);
}
function update(){
 const lat=parseFloat(document.getElementById('site').value.split(',')[0]);
 const year=parseFloat(document.getElementById('year').value);
 const mode=document.getElementById('scene').value;
 const lambda=parseFloat(document.getElementById('stagione').value);
 const pos={};for(const s of CAT)pos[s[0]]=starOfDate(s,year);
 // il Sole di quella stagione, in quell'epoca (obliquita' dell'epoca, non di oggi)
 const [raSole,decSole]=soleRaDec(lambda,year);
 const H0=angoloOrarioAlba(decSole,lat);          // angolo orario del sorgere
 let lst;
 if(mode==='dawn')      lst=raSole+(H0===null?-90:H0);
 else if(mode==='noon') lst=raSole;
 else if(mode==='dusk') lst=raSole-(H0===null?-90:H0);
 else if(mode==='culm') lst=pos['Alnilam'][0];
 else                   lst=parseFloat(document.getElementById('lst').value);
 lst=((lst%360)+360)%360;
 document.getElementById('lstval').textContent=Math.round(lst)+'\u00b0';
 const [altSole,azSole]=altaz(raSole,decSole,lst,lat);
 // col Sole alto le stelle svaniscono, come nella realta'
 const velo=Math.max(0,Math.min(1,(3-altSole)/9));
 let bestPole=null;
 for(const s of CAT){
  const [ra,dec]=pos[s[0]];
  const pd=90-Math.abs(dec);
  if(bestPole===null||pd<bestPole[1])bestPole=[s[0],pd];
  const [alt,az]=altaz(ra,dec,lst,lat);
  const o=stars[s[0]];
  const vis=alt>-1&&velo>0.02;
  o.mesh.visible=vis;o.label.visible=vis;o.glow.visible=vis;
  if(vis){const [x,y,z]=azalt2xyz(az,alt,R);
   o.mesh.position.set(x,y,z);o.glow.position.set(x,y,z);o.label.position.set(x,y+45,z);
   o.mesh.material.opacity=velo;
   o.label.material.opacity=velo;
   o.glow.material.opacity=Math.min(1,0.35+Math.max(0,alt)/18)*velo;}}
 LINEDEF.forEach(([a,b],i)=>{
  const A=altaz(...pos[a],lst,lat),B=altaz(...pos[b],lst,lat);
  const ok=A[0]>-1&&B[0]>-1&&velo>0.02;lines[i].visible=ok;
  lines[i].material.opacity=0.5*velo;
  if(ok){const pts=lines[i].geometry.attributes.position.array;
   const p1=azalt2xyz(A[1],A[0],R),p2=azalt2xyz(B[1],B[0],R);
   pts[0]=p1[0];pts[1]=p1[1];pts[2]=p1[2];pts[3]=p2[0];pts[4]=p2[1];pts[5]=p2[2];
   lines[i].geometry.attributes.position.needsUpdate=true;}});
 aggiornaCielo(altSole,azSole);
 ultimoGiorno=Math.max(0,Math.min(1,(altSole+12)/15));
 tintaMonumenti(ultimoGiorno);
 const soleVisibile=altSole>-2;
 sun.visible=soleVisibile;sunGlow.visible=soleVisibile;
 if(soleVisibile){
  const [x,y,z]=azalt2xyz(azSole,altSole,R);
  sun.position.set(x,y,z);sunGlow.position.set(x,y,z);
  // radente sull'orizzonte: il disco si arrossa e l'alone si allarga
  const basso=Math.max(0,1-Math.abs(altSole)/12);
  sun.material.color.setRGB(1,1-0.32*basso,1-0.72*basso);
  sunGlow.scale.set(340+basso*430,340+basso*430,1);
  sunGlow.material.opacity=0.55+0.45*basso;}
 document.getElementById('epoch').textContent=bc(year);
 poleTxt='\u2605 al polo: '+bestPole[0]+' ('+bestPole[1].toFixed(1)+'\u00b0)'
  +'   \u00b7   \u2600 '+(altSole>=0?'+':'')+altSole.toFixed(1)+'\u00b0  az '+Math.round(azSole)+'\u00b0';
 document.getElementById('pole').textContent=poleTxt;
 updateHud();
}
init();
